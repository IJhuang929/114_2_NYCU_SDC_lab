#     鏈: base_link → top_122219002200 (≈Identity) → radar_front
#     T_base_to_radar ≈ T_top_to_radar (from tf_static)

T_base_to_radar: [  0.999983,  0.00505, -0.002915,  2.022,
                       -0.005,     0.999843,  0.017014,  0.359,
