# from data/Track1/init_guess.txt (4x4 matrix, row-major 3x4 portion)
init_guess_track1: [ 0.728890808,  0.683169323, -0.044697496, -255.802342274,
                    -0.683634565,  0.729797536,  0.006271880, -123.139975819,
                     0.036904879,  0.025985237,  0.998980879,   -3.331959313]
# from data/Track2/init_guess.txt
init_guess_track2: [ 0.699603508, -0.712504332, -0.053782041,  169.701155884,
                     0.713430858,  0.700720265, -0.002742425,  -28.930335462,
                     0.039640155, -0.036451157,  0.998548932,    5.084140257]

